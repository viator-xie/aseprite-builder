name: 003 Attack Combo Stage A

on:
  workflow_dispatch:
  push:
    paths:
      - 'retarget_003_attack_stageA.py'
      - '.github/workflows/attack003_stageA.yml'

jobs:
  stage-a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install motion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scipy einops bvhio matplotlib
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Load official Kimodo motion utilities only
        run: |
          git clone --depth 1 https://github.com/nv-tlabs/kimodo.git kimodo
          test -f kimodo/kimodo/assets/skeletons/somaskel77/somaskel77_standard_tpose.bvh
          printf '%s\n' '"""Minimal CI package initializer; heavy model imports disabled."""' > kimodo/kimodo/__init__.py
          printf '%s\n' '"""Minimal CI exports initializer; import concrete modules directly."""' > kimodo/kimodo/exports/__init__.py
          printf '%s\n' '"""Minimal CI motion_rep initializer; import feature modules directly."""' > kimodo/kimodo/motion_rep/__init__.py

      - name: Download CMU swordplay 02_07 02_08 02_09
        run: |
          set -euxo pipefail
          mkdir -p attack003_source
          for ID in 02_07 02_08 02_09; do
            curl -L --fail --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/Shriinivas/cmubvh/main/Sequence-001-009/02/Data/${ID}.zip" \
              -o "attack003_source/${ID}.zip"
            sha256sum "attack003_source/${ID}.zip" | tee "attack003_source/${ID}_zip_sha256.txt"
            mkdir -p "attack003_source/${ID}_unpacked"
            unzip -q "attack003_source/${ID}.zip" -d "attack003_source/${ID}_unpacked"
            BVH="$(find "attack003_source/${ID}_unpacked" -type f -iname '*.bvh' | head -n1)"
            test -n "$BVH"
            cp "$BVH" "attack003_source/${ID}.bvh"
            sha256sum "attack003_source/${ID}.bvh" | tee "attack003_source/${ID}_bvh_sha256.txt"
            grep -n -m1 '^Frames:' "attack003_source/${ID}.bvh"
            grep -n -m1 '^Frame Time:' "attack003_source/${ID}.bvh"
            rm -rf "attack003_source/${ID}_unpacked" "attack003_source/${ID}.zip"
          done

      - name: Retarget all swordplay to native SOMA77 and extract slash candidates
        run: |
          PYTHONPATH=kimodo python retarget_003_attack_stageA.py
          test -f attack003_stageA/003_stageA_summary.json
          test -f attack003_stageA/02_07/02_07_Swordplay_SOMA77_30fps.bvh
          test -f attack003_stageA/02_08/02_08_Swordplay_SOMA77_30fps.bvh
          test -f attack003_stageA/02_09/02_09_Swordplay_SOMA77_30fps.bvh
          cat attack003_stageA/003_stageA_summary.json

      - name: Upload 003 Stage A
        uses: actions/upload-artifact@v4
        with:
          name: 003_Attack_Combo_StageA
          path: |
            attack003_source/*.bvh
            attack003_source/*_sha256.txt
            attack003_stageA/
          if-no-files-found: error
          retention-days: 14
