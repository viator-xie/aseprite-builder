name: Kimodo F01 Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install client, Blender and gltfpack
        run: |
          python -m pip install --upgrade pip
          pip install 'gradio_client>=1.8,<2' pillow
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libglx0 libopengl0 libgl1-mesa-dri xvfb
          npm install --global gltfpack

      - name: Generate F01 with Kimodo
        env:
          ANIMOFLOW_SPACE: AnimoFlow/animoflow-demo
          KIMODO_MODEL: kimodo
          KIMODO_CHARACTER: Y_bot
          KIMODO_DURATION: '5.0'
          KIMODO_SEED: '42'
          KIMODO_PROMPT: >-
            A timid young woman standing idle nervously with both arms hanging naturally at her sides, palms facing inward toward the thighs, thumbs pointing forward, shoulders slightly hunched and inward, head slightly lowered, subtle nervous breathing and tiny cautious weight shifts, realistic restrained body language, no weapon, no magic, no exaggerated gestures.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python run_kimodo.py

      - name: Decompress GLB for QA only
        run: |
          mkdir -p artifacts/qa_input
          SRC=$(find artifacts -maxdepth 1 -name '*.glb' -print -quit)
          test -n "$SRC"
          gltfpack -i "$SRC" -o artifacts/qa_input/F01_uncompressed.glb -kn -km -ke

      - name: Verify Blender Python environment
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-expr "import sys, numpy; print('BLENDER_PYTHON', sys.version); print('NUMPY', numpy.__version__)"

      - name: Blender animation QA
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a env PYTHONPATH=/usr/lib/python3/dist-packages LIBGL_ALWAYS_SOFTWARE=1 blender --background --python qa_blender.py
          test -f artifacts/qa_report.json
          test -n "$(find artifacts/qa_preview -name '*.png' -print -quit)"

      - name: Build QA contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          files=sorted(Path('artifacts/qa_preview').glob('*.png'))
          if not files:
              raise SystemExit('no QA renders')
          thumbs=[]
          for p in files:
              im=Image.open(p).convert('RGB').resize((360,360))
              canvas=Image.new('RGB',(360,390),'white')
              canvas.paste(im,(0,0))
              ImageDraw.Draw(canvas).text((8,366),p.stem,fill='black')
              thumbs.append(canvas)
          cols=5
          rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*360,rows*390),(225,225,225))
          for i,im in enumerate(thumbs):
              sheet.paste(im,((i%cols)*360,(i//cols)*390))
          sheet.save('artifacts/F01_QA_contact_sheet.jpg',quality=92)
          PY

      - name: Upload result and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F01_Fearful_Idle_Main_Kimodo
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
