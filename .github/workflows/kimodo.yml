name: CMU 137_28 Native SOMA77 Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  native-retarget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install native retarget dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow scipy bvhio einops
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download official Kimodo repository
        run: |
          git clone --depth 1 https://github.com/nv-tlabs/kimodo.git kimodo
          test -f kimodo/kimodo/assets/skeletons/somaskel77/somaskel77_standard_tpose.bvh
          grep -n -m1 '^Frames:' kimodo/kimodo/assets/skeletons/somaskel77/somaskel77_standard_tpose.bvh
          # Only disable package-level convenience re-exports. The actual
          # official skeleton/BVH/motion modules used below remain untouched.
          printf '%s\n' '"""Minimal CI package initializer; heavy model imports disabled."""' > kimodo/kimodo/__init__.py
          printf '%s\n' '"""Minimal CI exports initializer; import concrete modules directly."""' > kimodo/kimodo/exports/__init__.py
          printf '%s\n' '"""Minimal CI motion_rep initializer; import feature modules directly."""' > kimodo/kimodo/motion_rep/__init__.py

      - name: Fetch CMU 137_28 Normal Wait source
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil, zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          page_url='https://www.mediafire.com/?u4yfyyvq8yyok93'
          out=Path('cmu_source'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'})
          r=s.get(page_url,timeout=40); r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          candidates=[]
          for selector in ['a#downloadButton','a.input.popsok','a[aria-label*="Download"]']:
              for a in soup.select(selector):
                  if a.get('href'): candidates.append(a['href'])
          candidates += re.findall(r'https?://download[^"\'<>\\ ]+',r.text)
          seen=[]
          for u in candidates:
              u=u.replace('&amp;','&')
              if u not in seen and ('mediafire.com' in u or 'download' in u): seen.append(u)
          if not seen: raise RuntimeError('Could not resolve MediaFire direct URL')
          zp=out/'cmu_136_140_2010.zip'; last=None
          for direct in seen:
              try:
                  with s.get(direct,stream=True,timeout=60,allow_redirects=True) as dr:
                      dr.raise_for_status()
                      with zp.open('wb') as f:
                          for chunk in dr.iter_content(1024*1024):
                              if chunk: f.write(chunk)
                  if zipfile.is_zipfile(zp): break
                  last=RuntimeError('candidate not zip')
              except Exception as exc: last=exc
          else: raise RuntimeError(f'No ZIP candidate: {last!r}')
          archive_sha=hashlib.sha256(zp.read_bytes()).hexdigest()
          with zipfile.ZipFile(zp) as z:
              hits=[n for n in z.namelist() if Path(n).name.lower()=='137_28.bvh']
              if not hits: raise RuntimeError('137_28.bvh missing')
              member=hits[0]; target=out/'137_28.bvh'
              with z.open(member) as src,target.open('wb') as dst: shutil.copyfileobj(src,dst)
          file_sha=hashlib.sha256(target.read_bytes()).hexdigest()
          meta={
              'motion_id':'137_28','description':'Normal Wait',
              'source_dataset':'Carnegie Mellon Graphics Lab Motion Capture Database',
              'source_page':'https://sites.google.com/a/cgspeed.com/cgspeed/motion-capture/the-motionbuilder-friendly-bvh-conversion-release-of-cmus-motion-capture-database',
              'mediafire_page':page_url,'archive_member':member,
              'archive_sha256':archive_sha,'extracted_sha256':file_sha,
              'note':'CGSpeed 2010 first T-pose is calibration only; original CMU motion follows unchanged.'
          }
          (out/'137_28_source.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          zp.unlink()
          print(json.dumps(meta,indent=2))
          PY
          grep -n -m1 '^Frames:' cmu_source/137_28.bvh
          grep -n -m1 '^Frame Time:' cmu_source/137_28.bvh

      - name: Native Y-up CMU to SOMA77 retarget and official roundtrip
        run: |
          # Clean up two tiny issues in the first checked-in draft before running:
          # parser import location + dtype normalization in numerical QA only.
          sed -i 's/from kimodo.exports.bvh import bvh_to_kimodo_motion, parse_bvh_motion, save_motion_bvh/from kimodo.exports.bvh import bvh_to_kimodo_motion, save_motion_bvh/' retarget_cmu_to_soma_native.py
          sed -i 's/from kimodo.skeleton.bvh import Bvh, SkeletonBvh, load_bvh_animation/from kimodo.skeleton.bvh import Bvh, SkeletonBvh, load_bvh_animation, parse_bvh_motion/' retarget_cmu_to_soma_native.py
          sed -i '/def rot_angle_between/a\    b = b.to(dtype=a.dtype, device=a.device)' retarget_cmu_to_soma_native.py
          sed -i 's|root_round_err = torch.linalg.norm(motion\["root_positions"\] - round_motion\["root_positions"\], dim=-1)|root_round_err = torch.linalg.norm(motion["root_positions"] - round_motion["root_positions"].to(dtype=motion["root_positions"].dtype, device=motion["root_positions"].device), dim=-1)|' retarget_cmu_to_soma_native.py
          PYTHONPATH=kimodo python retarget_cmu_to_soma_native.py
          test -f native_out/137_28_soma77_native_30fps.npz
          test -f native_out/137_28_soma77_native_30fps.bvh
          test -f native_out/native_retarget_report.json
          test -n "$(find native_out/candidates -name '*.bvh' -print -quit)"
          echo '--- Native SOMA header ---'
          head -n 18 native_out/137_28_soma77_native_30fps.bvh
          grep -n -m1 '^Frames:' native_out/137_28_soma77_native_30fps.bvh
          grep -n -m1 '^Frame Time:' native_out/137_28_soma77_native_30fps.bvh

      - name: Install Blender QA runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libglx0 libopengl0 libgl1-mesa-dri xvfb

      - name: Render top three 5-second idle candidates
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a env PYTHONPATH=/usr/lib/python3/dist-packages LIBGL_ALWAYS_SOFTWARE=1 blender --background --python qa_native_soma_candidates.py
          test -f native_out/qa_candidates/qa_candidates.json
          test -n "$(find native_out/qa_candidates -name '*.png' -print -quit)"

      - name: Build candidate QA contact sheet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw
          report=json.loads(Path('native_out/native_retarget_report.json').read_text())
          wins=report['top_idle_windows']
          files=sorted(Path('native_out/qa_candidates').glob('*.png'))
          if not files: raise SystemExit('no candidate QA renders')
          cells=[]
          for p in files:
              im=Image.open(p).convert('RGB').resize((300,300))
              c=Image.new('RGB',(300,334),'white'); c.paste(im,(0,0))
              ImageDraw.Draw(c).text((6,310),p.stem,fill='black')
              cells.append(c)
          cols=6; rows=(len(cells)+cols-1)//cols
          sheet=Image.new('RGB',(cols*300,rows*334),(225,225,225))
          for i,c in enumerate(cells): sheet.paste(c,((i%cols)*300,(i//cols)*334))
          sheet.save('native_out/001_idle_candidates_contact_sheet.jpg',quality=93)
          txt=[]
          for i,w in enumerate(wins,1):
              txt.append(f"Candidate {i}: {w['start_seconds']:.1f}-{w['end_seconds']:.1f}s score={w['score']:.5f}")
          Path('native_out/001_candidate_summary.txt').write_text('\n'.join(txt)+'\n',encoding='utf-8')
          print('\n'.join(txt))
          PY

      - name: Upload native SOMA77 result and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CMU_137_28_Native_SOMA77_Pipeline
          path: |
            cmu_source/137_28_source.json
            native_out/
          if-no-files-found: warn
          retention-days: 7
