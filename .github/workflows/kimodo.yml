name: CMU 137_28 Source Fetch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch-cmu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install downloader dependencies
        run: pip install requests beautifulsoup4

      - name: Download CGSpeed CMU 136-140 pack and extract 137_28
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil, sys, zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          page_url = 'https://www.mediafire.com/?u4yfyyvq8yyok93'
          out = Path('cmu_source')
          out.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'})

          print('Fetching MediaFire landing page:', page_url)
          r = session.get(page_url, timeout=40)
          print('Landing status:', r.status_code, 'bytes:', len(r.content), 'final:', r.url)
          r.raise_for_status()
          (out/'mediafire_landing.html').write_bytes(r.content)

          soup = BeautifulSoup(r.text, 'html.parser')
          candidates = []
          for selector in ['a#downloadButton', 'a.input.popsok', 'a[aria-label*="Download"]']:
              for a in soup.select(selector):
                  href = a.get('href')
                  if href:
                      candidates.append(href)
          candidates += re.findall(r'https?://download[^"\'<>\\ ]+', r.text)
          # Preserve order, discard obvious non-download links.
          seen=[]
          for u in candidates:
              u=u.replace('&amp;','&')
              if u not in seen and ('mediafire.com' in u or 'download' in u):
                  seen.append(u)
          print('Direct candidates:', json.dumps(seen[:10], indent=2))
          if not seen:
              raise RuntimeError('Could not resolve MediaFire direct download URL')

          zip_path = out/'cmu_136_140_2010.zip'
          last=None
          for direct in seen:
              try:
                  print('Trying:', direct)
                  with session.get(direct, stream=True, timeout=60, allow_redirects=True) as dr:
                      print('Download status:', dr.status_code, 'type:', dr.headers.get('content-type'), 'len:', dr.headers.get('content-length'), 'final:', dr.url)
                      dr.raise_for_status()
                      with zip_path.open('wb') as f:
                          for chunk in dr.iter_content(1024*1024):
                              if chunk:
                                  f.write(chunk)
                  if zipfile.is_zipfile(zip_path):
                      break
                  last=RuntimeError(f'candidate did not return ZIP: {direct}')
              except Exception as exc:
                  last=exc
                  print('Candidate failed:', repr(exc))
          else:
              raise RuntimeError(f'No candidate yielded a ZIP; last={last!r}')

          size=zip_path.stat().st_size
          sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('ZIP OK:', size, 'sha256:', sha)

          with zipfile.ZipFile(zip_path) as z:
              names=z.namelist()
              hits=[n for n in names if Path(n).name.lower() in {'137_28.bvh','137_28.fbx','137_28.glb'}]
              print('137_28 hits:', hits)
              if not hits:
                  near=[n for n in names if '137_28' in n.lower()]
                  print('Near matches:', near)
                  raise RuntimeError('137_28 not found inside archive')
              # Prefer the requested BVH original from the CGSpeed conversion pack.
              hits.sort(key=lambda n: (0 if n.lower().endswith('.bvh') else 1, n))
              member=hits[0]
              target=out/Path(member).name
              with z.open(member) as src, target.open('wb') as dst:
                  shutil.copyfileobj(src,dst)

          file_sha=hashlib.sha256(target.read_bytes()).hexdigest()
          meta={
              'motion_id':'137_28',
              'description':'Normal Wait',
              'source_dataset':'Carnegie Mellon Graphics Lab Motion Capture Database',
              'conversion_release':'CGSpeed MotionBuilder-friendly BVH 2010 re-release',
              'source_page':'https://sites.google.com/a/cgspeed.com/cgspeed/motion-capture/the-motionbuilder-friendly-bvh-conversion-release-of-cmus-motion-capture-database',
              'mediafire_page':page_url,
              'archive_member':member,
              'archive_size_bytes':size,
              'archive_sha256':sha,
              'extracted_file':target.name,
              'extracted_sha256':file_sha,
              'note':'CGSpeed states the 2010 re-release only changed the added initial T-pose; the CMU motion data itself was unchanged.'
          }
          (out/'137_28_source.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          print(json.dumps(meta,indent=2))

          # Do not upload the 61 MB source archive; keep only the extracted motion + provenance.
          zip_path.unlink(missing_ok=True)
          (out/'mediafire_landing.html').unlink(missing_ok=True)
          PY

      - name: Inspect BVH header
        run: |
          test -f cmu_source/137_28.bvh
          head -n 40 cmu_source/137_28.bvh
          grep -n -m1 '^Frames:' cmu_source/137_28.bvh
          grep -n -m1 '^Frame Time:' cmu_source/137_28.bvh

      - name: Upload CMU source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CMU_137_28_Normal_Wait_Source
          path: cmu_source/
          if-no-files-found: warn
          retention-days: 7
