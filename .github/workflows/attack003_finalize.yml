name: Finalize 003 Three Hit Attack

on:
  workflow_dispatch:
  push:
    paths:
      - 'finalize_003_attack_combo.py'
      - '.github/workflows/attack003_finalize.yml'

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download validated 003 Stage A artifact
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: attack003_stageA.yml
          name: 003_Attack_Combo_StageA
          path: stageA
          search_artifacts: true
          workflow_conclusion: success

      - name: Install motion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scipy einops bvhio matplotlib
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Load official Kimodo motion utilities only
        run: |
          git clone --depth 1 https://github.com/nv-tlabs/kimodo.git kimodo
          test -f kimodo/kimodo/assets/skeletons/somaskel77/somaskel77_standard_tpose.bvh
          printf '%s\n' '"""Minimal CI package initializer; heavy model imports disabled."""' > kimodo/kimodo/__init__.py
          printf '%s\n' '"""Minimal CI exports initializer; import concrete modules directly."""' > kimodo/kimodo/exports/__init__.py
          printf '%s\n' '"""Minimal CI motion_rep initializer; import feature modules directly."""' > kimodo/kimodo/motion_rep/__init__.py

      - name: Build final continuous 3-hit combo
        run: |
          PYTHONPATH=kimodo python finalize_003_attack_combo.py
          test -f attack003_final/003_A01_Attack_Combo_3Hit_InPlace_SOMA77_30fps.bvh
          test -f attack003_final/003_A01_Attack_Combo_3Hit_RootMotion_SOMA77_30fps.bvh
          test -f attack003_final/003_combo_contact_sheet.png
          test -f attack003_final/003_final_report.json
          cat attack003_final/003_final_report.json

      - name: Upload final 003 motion data
        uses: actions/upload-artifact@v4
        with:
          name: 003_Attack_Combo_Final
          path: attack003_final/
          if-no-files-found: error
          retention-days: 14
