name: Finalize 001 Timid Idle

on:
  workflow_run:
    workflows: ["CMU 137_28 Native SOMA77 Pipeline"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  finalize-001:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download validated native SOMA77 artifact
        uses: actions/download-artifact@v4
        with:
          name: CMU_137_28_Native_SOMA77_Pipeline
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install finalization dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scipy einops matplotlib
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Load official Kimodo motion utilities only
        run: |
          git clone --depth 1 https://github.com/nv-tlabs/kimodo.git kimodo
          test -f kimodo/kimodo/assets/skeletons/somaskel77/somaskel77_standard_tpose.bvh
          printf '%s\n' '"""Minimal CI package initializer; heavy model imports disabled."""' > kimodo/kimodo/__init__.py
          printf '%s\n' '"""Minimal CI exports initializer; import concrete modules directly."""' > kimodo/kimodo/exports/__init__.py
          printf '%s\n' '"""Minimal CI motion_rep initializer; import feature modules directly."""' > kimodo/kimodo/motion_rep/__init__.py

      - name: Build formal 001 seamless idle loop
        run: |
          test -f native_out/137_28_soma77_native_30fps.npz
          PYTHONPATH=kimodo python finalize_001_idle.py
          test -f native_out/001_timid_idle_soma77_30fps.npz
          test -f native_out/001_timid_idle_soma77_30fps.bvh
          test -f native_out/001_timid_idle_loop_report.json
          cat native_out/001_timid_idle_loop_report.json
          grep -n -m1 '^Frames:' native_out/001_timid_idle_soma77_30fps.bvh
          grep -n -m1 '^Frame Time:' native_out/001_timid_idle_soma77_30fps.bvh

      - name: Build final 001 visual QA contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import numpy as np
          import matplotlib.pyplot as plt

          out=Path('native_out')
          data=np.load(out/'001_timid_idle_soma77_30fps.npz')
          pos=data['posed_joints']
          text=(out/'001_timid_idle_soma77_30fps.bvh').read_text(encoding='utf-8',errors='replace')
          names=[]
          for line in text.splitlines():
              m=re.match(r'\s*(ROOT|JOINT)\s+(.+)$',line)
              if m: names.append(m.group(2).strip())
          if names and names[0]=='Root': names=names[1:]
          if len(names)!=77: raise RuntimeError(f'Expected 77 SOMA joints, got {len(names)}')
          J={n:i for i,n in enumerate(names)}
          edges=[
              ('Hips','Spine1'),('Spine1','Spine2'),('Spine2','Chest'),('Chest','Neck1'),('Neck1','Neck2'),('Neck2','Head'),
              ('Chest','LeftShoulder'),('LeftShoulder','LeftArm'),('LeftArm','LeftForeArm'),('LeftForeArm','LeftHand'),
              ('Chest','RightShoulder'),('RightShoulder','RightArm'),('RightArm','RightForeArm'),('RightForeArm','RightHand'),
              ('Hips','LeftLeg'),('LeftLeg','LeftShin'),('LeftShin','LeftFoot'),('LeftFoot','LeftToeBase'),
              ('Hips','RightLeg'),('RightLeg','RightShin'),('RightShin','RightFoot'),('RightFoot','RightToeBase')]
          frames=[0,30,59,60,90,119]
          fig,axes=plt.subplots(2,len(frames),figsize=(15,6))
          for c,f in enumerate(frames):
              for r,(a0,a1,label) in enumerate([(0,1,'front'),(2,1,'side')]):
                  ax=axes[r,c]; p=pos[f]
                  for u,v in edges:
                      q=p[[J[u],J[v]]]
                      ax.plot(q[:,a0],q[:,a1],linewidth=2)
                  ax.set_aspect('equal',adjustable='box')
                  ax.set_title(f'f{f:03d} {f/30:.2f}s {label}',fontsize=9)
                  ax.set_xticks([]); ax.set_yticks([])
          fig.suptitle('001 timid idle — final seamless SOMA77 QA')
          fig.tight_layout()
          fig.savefig(out/'001_timid_idle_contact_sheet.png',dpi=160)
          plt.close(fig)
          PY
          test -f native_out/001_timid_idle_contact_sheet.png

      - name: Upload formal 001 deliverable
        uses: actions/upload-artifact@v4
        with:
          name: 001_Timid_Idle_SOMA77_Final
          path: |
            native_out/001_timid_idle_soma77_30fps.npz
            native_out/001_timid_idle_soma77_30fps.bvh
            native_out/001_timid_idle_loop_report.json
            native_out/001_timid_idle_contact_sheet.png
          if-no-files-found: error
          retention-days: 14
